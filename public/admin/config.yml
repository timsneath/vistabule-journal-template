# Sveltia CMS configuration. Served as a static file at /admin/.
# Editing is self-hosted: this admin SPA talks directly to the GitHub API.
#
# ── Make it yours ─────────────────────────────────────────────────────────
# 1. Set `repo` to your own GitHub repo ("your-username/your-repo").
# 2. Leave `branch` as your default branch (usually `main`).
# 3. `base_url` is OPTIONAL — it enables the one-click "Sign in with GitHub"
#    button via a small OAuth worker. Without it you can still sign in by
#    pasting a GitHub personal access token ("Sign in with Token"). See the
#    README section "Wire up the editor" to set up either.

backend:
  name: github
  repo: your-username/your-repo # ← change me
  branch: main
  # Optional one-click GitHub sign-in (see README). Delete this line to use
  # token sign-in only:
  # base_url: https://your-oauth-worker.your-subdomain.workers.dev

# Images are stored here in the repo and referenced by this path in content,
# matching how src/lib/images.ts resolves "/src/assets/trips/<file>".
media_folder: src/assets/trips
public_folder: /src/assets/trips

collections:
  - name: site
    label: Site
    delete: false
    files:
      - name: settings
        label: Site settings
        file: src/content/site.json
        fields:
          - { name: title, label: Title, widget: string }
          - { name: tagline, label: Tagline, widget: text, required: false }
          - {
              name: trailerName,
              label: Trailer name,
              widget: string,
              required: false,
              hint: "Your trailer's name (e.g. Itasca). Used in page titles, the home-page tagline and the About gallery.",
            }
          - name: authors
            label: Authors
            widget: list
            required: false
            hint: Whose journal is this? Used for the footer byline and the two notes labels on each trip ("<name>'s notes").

  - name: about
    label: About
    delete: false
    files:
      - name: about
        label: About page
        file: src/content/about.json
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: photo, label: Photo of the trailer, widget: image, required: false }
          - { name: body, label: Story, widget: markdown }
          - name: gallery
            label: Photo gallery
            label_singular: Photo
            widget: list
            required: false
            summary: '{{fields.caption}}'
            hint: Photos shown in the gallery at the bottom of the About page.
            fields:
              - {
                  name: image,
                  label: Image,
                  widget: image,
                  media_folder: /src/assets/about,
                  public_folder: /src/assets/about,
                }
              - { name: caption, label: Caption, widget: string, required: false }
          - name: specs
            label: Specifications
            label_singular: Spec
            widget: list
            required: false
            summary: '{{fields.label}}: {{fields.value}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }

  - name: manual
    label: Owner's manual
    delete: false
    files:
      - name: manual
        label: Manual links
        file: src/content/manual.json
        fields:
          - { name: intro, label: Intro, widget: text, required: false }
          - name: links
            label: Components
            label_singular: Component
            widget: list
            summary: '{{fields.what}} — {{fields.part}}'
            fields:
              - { name: what, label: What it is, widget: string }
              - { name: part, label: Part / model, widget: string, required: false }
              - {
                  name: category,
                  label: System,
                  widget: select,
                  options: [Trailer, Galley, Electrical, Plumbing, Towing, Comfort, Other],
                  default: Other,
                }
              - { name: productUrl, label: Product page, widget: string, required: false }
              - { name: manualUrl, label: Manual, widget: string, required: false }

  - name: trips
    label: Trips
    label_singular: Trip
    folder: src/content/trips
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — {{startDate}}'
    sortable_fields: [startDate, title, miles]
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: startDate,
          label: Start date,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
        }
      - {
          name: endDate,
          label: End date,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
          required: false,
        }
      - { name: location, label: Location, widget: string }
      - name: stays
        label: Where we stayed
        widget: list
        required: false
        hint: Campgrounds or places you slept on this trip — one per item.
      - { name: miles, label: Miles driven, widget: number, value_type: int, min: 0 }
      - { name: coverPhoto, label: Cover photo, widget: image, required: false }
      - name: waypoints
        label: Route waypoints
        label_singular: Waypoint
        widget: list
        required: false
        summary: '{{fields.label}}'
        hint: >-
          In travel order. "Camps" are where you slept — the map opens on them.
          "Stops" get a pin; "Via" points just nudge the drawn route onto the
          roads you actually took.
        fields:
          - { name: label, label: Label, widget: string, required: false }
          - name: kind
            label: Type
            widget: select
            default: stop
            options:
              - { label: 'Camp (where you slept)', value: camp }
              - { label: 'Stop (a place we visited)', value: stop }
              - { label: 'Via (just shapes the route)', value: via }
          - name: arrive
            label: How we got here
            widget: select
            default: drive
            required: false
            hint: Ferry draws a straight crossing instead of road directions.
            options:
              - { label: Drive, value: drive }
              - { label: Ferry, value: ferry }
          # Search a place by name (or click the map / use your location) — no
          # more hand-entering coordinates. Stores a GeoJSON Point. The picker
          # opens on the Upper Midwest ([lng, lat]) — move `center` to wherever
          # you usually travel.
          - {
              name: location,
              label: Location,
              widget: map,
              type: Point,
              center: [-93.2, 45.5],
              zoom: 5,
            }
      - {
          name: roundTrip,
          label: Round trip (route returns home),
          widget: boolean,
          default: false,
          required: false,
          hint: If on, the drawn route loops back to the first waypoint.
        }
      - name: photos
        label: Photos
        label_singular: Photo
        widget: list
        required: false
        summary: '{{fields.caption}}'
        fields:
          - { name: image, label: Image, widget: image }
          - { name: caption, label: Caption, widget: string, required: false }
      # These two "voices" are labelled on the page by your site Authors. Rename
      # the labels below to match (e.g. "Alex's notes" / "Sam's notes").
      - { name: notesOne, label: First author's notes, widget: text, required: false }
      - { name: notesTwo, label: Second author's notes, widget: text, required: false }
